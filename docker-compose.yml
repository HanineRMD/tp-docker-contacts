version: '3.8'

services:
  database:
    build: ./database
    container_name: contacts-db-compose
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: contacts_db
    ports:
      - "3306:3306"
    networks:
      - contacts-compose-network
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  frontend:
    build: ./frontend
    container_name: contacts-frontend-compose
    environment:
      DB_HOST: database
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: contacts_db
    ports:
      - "3000:3000"
    networks:
      - contacts-compose-network
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

networks:
  contacts-compose-network:
    driver: bridge

volumes:
  db_data: